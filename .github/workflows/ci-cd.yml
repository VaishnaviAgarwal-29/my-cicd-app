name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the code from the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Node.js environment
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
  

    # 3. Install project dependencies
    - name: Install dependencies
      run: npm install

    # 4. Run tests (fails the pipeline if tests fail)
    - name: Run tests
      run: npm test

    # 5. Set up Docker Buildx (for advanced build features)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 6. Log in to Docker Hub (Skipped for pull requests to protect secrets)
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    # 7. Build and push the Docker image to the registry
    - name: Build and push Docker image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          your-dockerhub-username/node-cicd-demo:latest
          your-dockerhub-username/node-cicd-demo:${{ github.sha }}
